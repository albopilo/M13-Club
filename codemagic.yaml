workflows:
  android-apk:
    name: M13 Club Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.17.0

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build release APK
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
