workflows:
  android-aab:
    name: M13 Club Android AAB
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.17.0

      android_signing:
        - m13club_release

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build release AAB
        script: |
          cd android
          ./gradlew bundleRelease

      - name: Inspect AAB output
        script: |
          echo "=== AAB OUTPUT ==="
          find android/app/build/outputs/bundle -type f -name "*.aab" -print

          echo "=== RELEASE DIRECTORY ==="
          ls -lah android/app/build/outputs/bundle/release/ || true

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
